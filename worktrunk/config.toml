# Keep worktrees in one directory per repo, next to the repo rather than inside it.
# A worktree inside the checkout would be picked up by repo-wide tooling, which then
# sees a second copy of every file. `repo` and `repo_path` resolve at run time.
worktree-path = "{{ repo_path }}/../{{ repo }}-worktrees/{{ branch | sanitize }}"

[commit.generation]
command = "CLAUDECODE= MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"
