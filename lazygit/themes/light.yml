# Rose Pine Dawn, matching the ghostty light theme.
#
# Same rule as the dark overlay: the selected line only gets a background, so
# every background here is a light surface that the dark foreground reads on.
#
# Loaded by `scripts/lazygit` on top of config.yml. See that script.
gui:
  theme:
    activeBorderColor:
      - "#286983"
      - bold
    inactiveBorderColor:
      - "#9893a5"
    searchingActiveBorderColor:
      - "#b4637a"
      - bold
    optionsTextColor:
      - "#286983"
    selectedLineBgColor:
      - "#dfdad9"
    inactiveViewSelectedLineBgColor:
      - "#f4ede8"
    cherryPickedCommitFgColor:
      - "#286983"
    cherryPickedCommitBgColor:
      - "#cfe0e2"
    markedBaseCommitFgColor:
      - "#b4637a"
    markedBaseCommitBgColor:
      - "#f2e9e1"
    unstagedChangesColor:
      - "#b4637a"
# Diffs go through delta with pale red and green backgrounds that suit the
# cream base. bat ships no Rose Pine theme, so syntax colors come from
# gruvbox-light, whose warm palette sits well on it.
git:
  diffRenderers:
    - colorArg: always
      command: delta --light --paging=never --syntax-theme=gruvbox-light --line-numbers --minus-style='syntax "#f3d9d6"' --minus-emph-style='syntax "#e8b9b4"' --plus-style='syntax "#dde8cf"' --plus-emph-style='syntax "#c4d9ac"'
