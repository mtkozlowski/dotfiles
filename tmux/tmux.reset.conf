# First remove *all* keybindings
# unbind-key -a
# unbind-key C-o
# Now reinsert all the regular tmux keys
# Route status-bar clicks on a session name to switch-client (tmux only auto-binds
# window ranges); everything else keeps default select-window.
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},session}' 'switch-client -t=' 'select-window -t='

# prefix+! : jump to the window with a pending bell (any session) and clear it.
# ##{...} escapes the format vars past run-shell's own #{...} expansion.
bind ! run-shell 'w=$(tmux list-windows -a -f "##{window_bell_flag}" -F "##{session_name}:##{window_index}" | head -n1); [ -n "$w" ] && tmux switch-client -t "${w%%:*}" && tmux select-window -t "$w"'

bind @ break-pane   # default break-pane, moved off ! (taken above)

bind ^X lock-server
bind ^C new-window -c "$HOME"
bind C new-window -c "#{pane_current_path}"
bind ^D detach
bind * list-clients

bind H previous-window
bind L next-window

bind r command-prompt "rename-window %%"
bind R source-file ~/.config/tmux/tmux.conf
bind ^A last-window
bind a send-prefix
# After the prefix, Escape cancels back to root instead of falling through to
# the focused pane (e.g. interrupting Claude Code). Unbound prefix keys are
# otherwise re-dispatched in the root table and forwarded to the app.
bind -T prefix Escape switch-client -T root
bind ^W list-windows
bind w list-windows
bind z resize-pane -Z
bind ^L refresh-client
bind | split-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '"' choose-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7
bind : command-prompt
bind * setw synchronize-panes
bind P set pane-border-status
bind c kill-pane
bind x swap-pane -D
bind S choose-session
bind N command-prompt -p "new session name:" { new-session -d -s "%1" ; move-window -k -t "%1":1 }
bind K send-keys "clear"\; send-keys "Enter"
bind C-x command-prompt "send-keys %%"
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Forward a raw Ctrl-O byte (0x0F) to the focused app. Needed for Claude Code's
# transcript toggle (app:toggleTranscript): our `extended-keys on` re-encodes a
# directly-typed Ctrl-O as a CSI-u sequence, but Claude Code fails to detect the
# Kitty keyboard protocol inside tmux (TERM_PROGRAM=tmux; upstream issue #27868)
# so it only parses the legacy 0x0F byte. send-keys injects that byte verbatim.
# Keep until #27868 is fixed; do NOT replace with a keybindings.json rebind
# (that syntax can't express the raw byte, and any ctrl+<key> gets re-encoded).
bind O send-keys C-o

bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind-key "w" run-shell "tmux select-window -t \"$(
  tmux list-windows -F '##{session_name}:##{window_index}  ##{window_name}##{?window_active, (active),}' | fzf-tmux -p 70%,60% \
    --no-sort --ansi --border-label ' windows ' --prompt '🪟  ' \
    --preview 'echo ▐ {2..}; echo; tmux capture-pane -ep -t {1}' \
    --preview-window 'right:55%' \
  | cut -d' ' -f1
)\""

# new window in a zoxide-picked dir (replaces sessionx C-y zo-new-window)
bind-key "C-y" run-shell "~/.config/tmux/scripts/new-window-zoxide.sh"

# lazygit in a popup, scoped to the current pane's directory
bind -N "lazygit (popup)" g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"

# superpowers SDD ledger (.superpowers/sdd) in a popup, scoped to the current pane's directory
bind -N "superpowers SDD ledger (popup)" G display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "sp-status"

bind -N "searchable keybindings (fzf popup)" ? {
  display-popup -w 80% -h 80% -E "~/.config/tmux/scripts/tmux-keys --pick"
  run-shell -b "~/.config/tmux/scripts/tmux-keys --exec"
}

bind -N "last-session (via sesh) " L run-shell "sesh last"

# prefix+i: mark the current pane and copy its id to the clipboard. The mark is a
# global, layout-stable target ({marked} / ~), so tooling (e.g. Claude Code reading
# a running process's logs) can `capture-pane -t '{marked}'` without tracking pane
# ids that shift as panes come and go; the clipboard copy hands that id off in one
# step. prefix+i again re-marks; prefix+M clears the mark. Overrides the tmux
# default binding (display-message — the window-info blurb).
#
# The id is copied via clip.sh (OSC 52 broadcast) like the yank/thumbs paths —
# set-buffer takes its data literally, so #{pane_id} would land in the buffer
# verbatim; run-shell expands the format up front, so clip.sh sees the real id.
bind-key i select-pane -m \; run-shell 'printf "%s" "#{pane_id}" | ~/.config/tmux/scripts/clip.sh' \; display-message 'marked & copied #{pane_id}'
