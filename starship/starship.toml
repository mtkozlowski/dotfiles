add_newline = false
# A minimal left prompt
format = """$directory$character"""
palette = "catppuccin_mocha"
# move the rest of the prompt to the right
right_format = """${custom.gh_pr}$all"""
command_timeout = 1000

[aws]
disabled = true
format = '[$symbol(profile: "$profile" )(\(region: $region\) )]($style)'
style = 'bold blue'
symbol = " "

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[✗](bold red)'

[docker_context]
disabled = true

[directory]
truncation_length = 8
truncation_symbol = '.../'

[git_branch]
format =  '[$symbol$branch(:$remote_branch)]($style)'
truncation_length = 20
truncation_symbol = '…'

[golang]
disabled = true
format = '[ ](bold cyan)'

[hostname]
# Real hostnames are machine-specific (and arguably private), so they stay out of
# this public repo. Show a short label only when it's exported by the per-machine
# overlay (.zshrc.local) via the env_var module below; otherwise show nothing.
disabled = true

[env_var.STARSHIP_HOST_LABEL]
variable = "STARSHIP_HOST_LABEL"
format = '[$env_value ]($style)'
style = 'bold dimmed green'

[nodejs]
disabled = true

[package]
disabled = true

[username]
disabled = true

## CUSTOM

# Shows the current branch's GitHub PR number, plus the number of the first
# issue it closes (from "Closes #N" etc. in the PR body), when one exists.
# A custom module only renders when `when` succeeds, so the PR check runs
# there; `command` calls the same script again to build the display string.
# gh-pr.sh caches gh's answer for 30s so the second call is a file read.
# A cold shell can make the first `gh` call take longer than starship's
# default command_timeout, so ignore_timeout defers to the script's own
# timeout instead of starship warning and giving up.
[custom.gh_pr]
when = '~/.config/starship/scripts/gh-pr.sh >/dev/null 2>&1'
command = '~/.config/starship/scripts/gh-pr.sh'
format = '[$symbol$output]($style) '
symbol = ' '
style = 'bold mauve'
ignore_timeout = true

