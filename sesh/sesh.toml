#:schema https://raw.githubusercontent.com/joshmedeski/sesh/refs/heads/main/sesh.schema.json

blacklist = ["scratch"]

[[session]]
name = "dotfiles"
# sesh expands environment variables. zsh/.zshrc exports DOTFILES.
path = "$DOTFILES"
startup_command = "nvim"
